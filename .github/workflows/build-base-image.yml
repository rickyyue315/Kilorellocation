name: Build Base Image

on:
  push:
    branches: [main, master]
    paths:
      - 'requirements.txt'
      - 'docker/Dockerfile.base'
      - '.github/workflows/build-base-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 需要先在 GitHub repo 的 Settings → Secrets and variables → Actions 設定：
      #   DOCKERHUB_USERNAME（Docker Hub 帳號）
      #   DOCKERHUB_TOKEN（https://hub.docker.com/settings/security 產生的 Access Token)
      # 基底映像只含公開 open-source 依賴，不含專案程式碼，可安全公開於 Docker Hub。
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag from requirements hash
        id: tag
        shell: bash
        run: |
          HASH=$(sha256sum requirements.txt | cut -c1-12)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: |
            rickyyue315/kilo-reallocation-base:latest
            rickyyue315/kilo-reallocation-base:py311-${{ steps.tag.outputs.hash }}
          cache-from: type=gha
          cache-to: type=gha, mode=max