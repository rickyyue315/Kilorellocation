name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 與本機開發／Streamlit Community Cloud 部署版本一致（勿用 3.14，pyarrow 21 無 cp314 wheel）
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

      - name: Import smoke test
        run: python -c "import app; import business_logic; import data_processor; import excel_generator; print('imports OK')"
