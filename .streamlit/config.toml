# Streamlit 全域設定 — 本機開發與 Streamlit Community Cloud 共用
# 注意：Community Cloud 會強制覆寫 showErrorDetails / fastReruns / runOnSave /
#       enableXsrfProtection / gatherUsageStats，其餘設定（主題、maxUploadSize）照常生效。
# 檔案監看保留預設值（auto），讓本機與雲端都能在原始碼變更後自動重跑。

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#D97706"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
