<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Arial, 'Microsoft JhengHei', 'PingFang TC', sans-serif">
  <!-- Turnday 保底計算流程圖（v2.32.0 教學用，深色主題） -->
  <rect x="0" y="0" width="1200" height="440" rx="16" fill="#12121a" stroke="#1e1e2e" stroke-width="1.5"/>

  <text x="40" y="46" font-size="21" font-weight="bold" fill="#00d4ff">Turnday 保底計算流程 — 以數據日期 2026-08-15（T-1）為例</text>
  <text x="40" y="72" font-size="13" fill="#888899">上載區輸入 MTD 數據日期後，系統自動完成以下三步計算，套用至全部 30 個調貨模式</text>

  <!-- ── ① 覆蓋日數 ────────────────────────────── -->
  <circle cx="52" cy="130" r="16" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="52" y="136" font-size="14" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="128" font-size="15" font-weight="bold" fill="#ffffff">覆蓋日數</text>
  <text x="80" y="147" font-size="11" fill="#888899">Coverage Days</text>

  <rect x="260" y="112" width="320" height="36" rx="8" fill="rgba(0,212,255,0.14)" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="420" y="135" font-size="13" fill="#9BE8FF" text-anchor="middle">7月（上月）· 31 日</text>
  <rect x="584" y="112" width="170" height="36" rx="8" fill="rgba(245,158,11,0.14)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="669" y="135" font-size="13" fill="#FCD34D" text-anchor="middle">MTD · 15 日</text>
  <text x="782" y="136" font-size="18" fill="#ffffff" text-anchor="middle">=</text>
  <rect x="804" y="112" width="160" height="36" rx="8" fill="rgba(16,185,129,0.14)" stroke="#10B981" stroke-width="1.5"/>
  <text x="884" y="135" font-size="14" font-weight="bold" fill="#6EE7B7" text-anchor="middle">覆蓋 46 日</text>
  <text x="1000" y="130" font-size="12" fill="#888899">覆蓋日數 = 上月日數</text>
  <text x="1000" y="148" font-size="12" fill="#888899">＋ MTD數據日期日號</text>

  <!-- ── ② 日銷速 ────────────────────────────── -->
  <circle cx="52" cy="222" r="16" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="52" y="228" font-size="14" fill="#ffffff" text-anchor="middle">2</text>
  <text x="80" y="220" font-size="15" font-weight="bold" fill="#ffffff">日銷速</text>
  <text x="80" y="239" font-size="11" fill="#888899">Daily Sold Rate</text>

  <rect x="260" y="204" width="250" height="36" rx="8" fill="rgba(136,136,153,0.12)" stroke="#888899" stroke-width="1.5"/>
  <text x="385" y="227" font-size="13" fill="#e6e6f0" text-anchor="middle">Effective Sold 92 件</text>
  <text x="528" y="228" font-size="18" fill="#ffffff" text-anchor="middle">÷</text>
  <rect x="552" y="204" width="130" height="36" rx="8" fill="rgba(136,136,153,0.12)" stroke="#888899" stroke-width="1.5"/>
  <text x="617" y="227" font-size="13" fill="#e6e6f0" text-anchor="middle">覆蓋 46 日</text>
  <text x="700" y="228" font-size="18" fill="#ffffff" text-anchor="middle">=</text>
  <rect x="724" y="204" width="240" height="36" rx="8" fill="rgba(0,212,255,0.14)" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="844" y="227" font-size="14" font-weight="bold" fill="#9BE8FF" text-anchor="middle">日銷速 2.0 件/日</text>
  <text x="260" y="260" font-size="12" fill="#888899">Effective Sold Qty = Last Month Sold 62 ＋ MTD Sold 30（系統自動計算）</text>

  <!-- ── ③ Turnday 保底 ────────────────────────── -->
  <circle cx="52" cy="318" r="16" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="52" y="324" font-size="14" fill="#ffffff" text-anchor="middle">3</text>
  <text x="80" y="316" font-size="15" font-weight="bold" fill="#ffffff">Turnday 保底</text>
  <text x="80" y="335" font-size="11" fill="#888899">ceil(日銷速 × N)</text>

  <rect x="260" y="296" width="300" height="44" rx="8" fill="rgba(136,136,153,0.12)" stroke="#888899" stroke-width="1.5"/>
  <text x="410" y="324" font-size="15" fill="#e6e6f0" text-anchor="middle">ceil( 2.0 件/日 × 14 日 )</text>
  <text x="586" y="324" font-size="20" fill="#10B981" text-anchor="middle">→</text>
  <rect x="612" y="296" width="220" height="44" rx="8" fill="rgba(245,158,11,0.14)" stroke="#F59E0B" stroke-width="2"/>
  <text x="722" y="324" font-size="17" font-weight="bold" fill="#FCD34D" text-anchor="middle">保底 28 件</text>
  <text x="860" y="316" font-size="12" fill="#888899">N（Turnday 日數）側邊欄自選</text>
  <text x="860" y="334" font-size="12" fill="#888899">3–60 日，預設 14</text>

  <!-- ── Footer ────────────────────────────── -->
  <line x1="40" y1="368" x2="1160" y2="368" stroke="#1e1e2e" stroke-width="1.5"/>
  <text x="40" y="394" font-size="12" fill="#888899">Turnday 主體下所有 Safety 觸點自動切換：轉出保底（庫存−T）· 緊急/潛在缺貨目標（T）· 補0目標 max(T×0.5, 3) · 接收上限 max(T×2, 3)</text>
  <text x="40" y="416" font-size="12" fill="#888899">零銷量 SKU → 保底 0（可全數轉出）；固定保底（C1 淨存&gt;2、F3/NST 保留2件、ND3/ND4 保留3件）不受主體影響</text>
</svg>
